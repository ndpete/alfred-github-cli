[project]
name = "alfred-github-cli"
version = "0.3.0"
description = "Alfred workflow for GitHub wrapping the gh CLI in pure Python standard library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nathan Peterson" }
]
dependencies = []

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
